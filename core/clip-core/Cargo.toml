[package]
name = "clip-core"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
chacha20poly1305 = "0.10.1"
ciborium = "0.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }
hex = "0.4.3"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "macros", "sync", "time", "net"], optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"], optional = true }
tracing = "0.1.44"
ulid = "3.0.0"
url = "2.5.4"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }

[features]
default = []
relay = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:rustls"]

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full"] }
