services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  relay:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - CLIPBRIDGE_ADDR=:8080
      - CLIPBRIDGE_REDIS_URL=redis://redis:6379/0
      - CLIPBRIDGE_LOG_LEVEL=info
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
